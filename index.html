      border: 1px solid #334155;

      color: #94a3b8;
      text-transform: uppercase;

      color: #0f172a;
      font-weight: 700;
      padding: 14px 24px;
      border: none;
      border-radius: 40px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      letter-spacing: 0.3px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover {
      background: #fde047;
      transform: scale(1.01);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

      padding: 10px 24px;
      border-radius: 40px;
      border: 1px solid #facc15;
      color: #facc15;
      letter-spacing: 2px;

      color: #f87171;
      border-color: #f87171;
      animation: pulse 1s infinite;
    }

      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }

    .questions-area {
      max-height: 65vh;
      overflow-y: auto;
      padding-right: 12px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      scrollbar-width: thin;
      scrollbar-color: #facc15 #1e293b;

      width: 8px;
    }

      border-radius: 8px;
    }

      align-items: center;

      font-size: 0.8rem;

      padding: 4px 12px;
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.4px;

    .options {

      flex-direction: column;
      gap: 10px;
      margin: 12px 0;
      padding-left: 8px;

    .option-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #1e293b;
      padding: 12px 18px;
      border-radius: 14px;

      background: #2d3b4f;

      height: 18px;
      accent-color: #facc15;
      cursor: pointer;

    .option-item label {
      cursor: pointer;
      flex: 1;
      font-size: 0.95rem;
    }

    .truefalse {
      display: flex;
      gap: 32px;
      margin: 12px 0 8px 8px;

      align-items: center;
      gap: 8px;
      cursor: pointer;
      background: #1e293b;
      padding: 10px 24px;
      border-radius: 40px;
      border: 1px solid #334155;
    }

      width: 100%;
      background: #0b1120;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 16px;
      color: #e2e8f0;
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;

      resize: vertical;

    textarea:focus, .code-editor:focus {
      border-color: #facc15;
    }

    .code-editor {

    }

    .submit-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      border-top: 1px solid #334155;
      padding-top: 22px;
      margin-top: 8px;
    }

    .status-msg {
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .hidden {
      display: none !important;
    }

      justify-content: center;
      gap: 24px;
      color: white;
      font-size: 1.6rem;
      text-align: center;
      padding: 32px;
    }

    .overlay small {
      font-size: 1rem;
      color: #94a3b8;
    }
  </style>
</head>

        html += `<div class="question-card" data-qidx="${idx}" id="card-${qId}">`;
        html += `<div class="question-title"><span class="q-number">Q${num}</span><span class="q-type">${typeLabel}</span></div>`;
        html += `<div style="margin-bottom:12px; font-weight:500;">${escapeHtml(q.text)}</div>`;

        if (q.type === 'mcq' && q.options) {
          html += `<div class="options">`;
          q.options.forEach((opt, oi) => {
            const radioName = `q${num}_radio`;
            html += `<div class="option-item">`;
            html += `<input type="radio" name="${radioName}" value="${oi}" id="opt_${num}_${oi}" data-qidx="${idx}" data-optidx="${oi}" class="mcq-radio">`;
            html += `<label for="opt_${num}_${oi}">${escapeHtml(opt)}</label>`;
            html += `</div>`;
          });
          html += `</div>`;
        } else if (q.type === 'tf') {
          html += `<div class="truefalse">`;
          html += `<label><input type="radio" name="tf_${num}" value="true" data-qidx="${idx}" data-tf="0"> True</label>`;
          html += `<label><input type="radio" name="tf_${num}" value="false" data-qidx="${idx}" data-tf="1"> False</label>`;
          html += `</div>`;
        } else if (q.type === 'long' || q.type === 'essay') {
          html += `<textarea rows="4" placeholder="Your answer here..." data-qidx="${idx}" data-type="${q.type}" class="text-answer"></textarea>`;
        } else if (q.type === 'practical') {
          html += `<textarea class="code-editor" rows="6" placeholder="Write HTML code here..." data-qidx="${idx}" data-type="practical"></textarea>`;
        }

        html += `</div>`;
      });
      questionsArea.innerHTML = html;
      attachQuestionListeners();
      updateProgress();
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        if (m === '"') return '&quot;';
        return m;
      });
    }

    function attachQuestionListeners() {
      document.querySelectorAll('.mcq-radio').forEach(radio => {
        radio.addEventListener('change', (e) => {
          const qidx = parseInt(e.target.dataset.qidx);
          const optidx = parseInt(e.target.dataset.optidx);
          answers[qidx] = { value: optidx, text: '' };
          updateProgress();
        });
      });
      document.querySelectorAll('input[data-tf]').forEach(radio => {
        radio.addEventListener('change', (e) => {
          const qidx = parseInt(e.target.dataset.qidx);
          const tfVal = parseInt(e.target.dataset.tf);
          answers[qidx] = { value: tfVal, text: '' };
          updateProgress();
        });
      });
      document.querySelectorAll('textarea[data-qidx]').forEach(ta => {
        ta.addEventListener('input', (e) => {
          const qidx = parseInt(e.target.dataset.qidx);
          answers[qidx] = { value: null, text: e.target.value };
          updateProgress();
        });
      });
    }

    function updateProgress() {
      let answered = 0;
      answers.forEach(ans => {
        if (ans.value !== null || (ans.text && ans.text.trim() !== '')) answered++;
      });
      progressStatus.innerText = `${answered} / 130 answered`;
    }

    // ---------- AUTO GRADING ----------
    function autoGrade() {
      let score = 0;
      let totalObjective = 0;
      questions.forEach((q, idx) => {
        if (q.type === 'mcq' || q.type === 'tf') {
          totalObjective++;
          if (answers[idx].value !== null && answers[idx].value === q.correct) {
            score++;
          }
        }
      });
      return { score, totalObjective };
    }

    // ---------- TIMER ----------
    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          timerDisplay.innerText = '00:00:00';
          forceSubmit('Time expired');
          return;
        }
        timeLeft--;
        const hrs = Math.floor(timeLeft / 3600);
        const mins = Math.floor((timeLeft % 3600) / 60);
        const secs = timeLeft % 60;
        timerDisplay.innerText = `${String(hrs).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
        if (timeLeft < 300) timerDisplay.classList.add('warning');
        else timerDisplay.classList.remove('warning');
      }, 1000);
    }

    // ---------- ANTI-CHEAT ----------
    function startAntiCheat() {
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
      document.addEventListener('visibilitychange', () => {
        if (!examActive) return;
        if (document.hidden) {
          tabSwitchCount++;
          antiCheatLog.classList.remove('hidden');
          antiCheatLog.innerText = `⚠️ Tab switch detected! (${tabSwitchCount})`;
          showOverlay('Tab switching is not allowed. Please stay on this tab.');
        }
      });
      document.addEventListener('fullscreenchange', () => {
        if (!examActive) return;
        if (!document.fullscreenElement) {
          fullscreenExitCount++;
          showOverlay('Fullscreen mode exited. Please return to fullscreen.');
        }
      });
      document.addEventListener('contextmenu', e => e.preventDefault());
      document.addEventListener('keydown', e => {
        if (e.ctrlKey && (e.key === 'c' || e.key === 'v' || e.key === 'u' || e.key === 's' || e.key === 'p')) {
          if (examActive) e.preventDefault();
        }
      });
    }

    function showOverlay(msg) {
      overlayMessage.innerText = msg || 'Please return to full screen and stay on this tab.';
      overlay.classList.remove('hidden');
    }

    function hideOverlay() {
      overlay.classList.add('hidden');
      if (examActive && !document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    }

    returnBtn.addEventListener('click', () => {
      hideOverlay();
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    });

    // ---------- SUBMIT VIA EMAILJS ----------
    async function sendEmailAndSubmit(reason = 'manual') {
      if (!examActive) return;
      examActive = false;
      clearInterval(timerInterval);

      const { score, totalObjective } = autoGrade();
      const timestamp = new Date().toLocaleString();

      // Build answer details (truncate each long answer to keep email readable)
      let answerDetails = '';
      questions.forEach((q, idx) => {
        const ans = answers[idx];
        let ansText = '';
        if (q.type === 'mcq' && ans.value !== null) {
          ansText = q.options[ans.value];
        } else if (q.type === 'tf' && ans.value !== null) {
          ansText = ans.value === 0 ? 'True' : 'False';
        } else if (ans.text && ans.text.trim()) {
          ansText = ans.text.length > 400 ? ans.text.substring(0, 400) + '...[truncated]' : ans.text;
        } else {
          ansText = '[no answer]';
        }
        answerDetails += `Q${idx+1} [${q.type.toUpperCase()}]: ${q.text}\n   → ${ansText}\n\n`;
      });

      // EmailJS template parameters
      const templateParams = {
        student_name: currentUser.fullname,
        course: currentUser.course,
        admission_number: currentUser.admission,
        timestamp: timestamp,
        reason: reason,
        score: score,
        total_objective: totalObjective,
        tab_switches: tabSwitchCount,
        fullscreen_exits: fullscreenExitCount,
        answer_details: answerDetails,
        to_email: "your-email@example.com"  // ← replace with YOUR email
      };

      submitExamBtn.disabled = true;
      submitExamBtn.innerText = '⏳ Sending...';

      try {
        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams);
        alert(`✅ Exam submitted successfully!\nAuto-graded score: ${score}/${totalObjective}\nYour answers have been emailed.`);
      } catch (err) {
        console.error('EmailJS error:', err);
        alert(`⚠️ Email could not be sent (${err.text || err.message || 'unknown error'}).\nYour score: ${score}/${totalObjective}.\nPlease contact the examiner.`);
      }

      // Reset UI
      examContainer.classList.add('hidden');
      loginContainer.classList.remove('hidden');
      overlay.classList.add('hidden');
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      submitExamBtn.disabled = false;
      submitExamBtn.innerText = '📨 Submit & Email';
      examActive = false;
    }

    function forceSubmit(reason) {
      if (examActive) sendEmailAndSubmit(reason);
    }

    submitExamBtn.addEventListener('click', () => {
      const answeredCount = answers.filter(a => a.value !== null || (a.text && a.text.trim())).length;
      if (confirm(`Submit exam now? You have answered ${answeredCount} / 130 questions.`)) {
        sendEmailAndSubmit('manual submit');
      }
    });

    // ---------- LOGIN ----------
    loginBtn.addEventListener('click', () => {
      const fullname = fullnameInput.value.trim();
      const course = courseInput.value.trim();
      const admission = admissionInput.value.trim();
      if (!fullname || !course || !admission) {
        alert('Please fill all fields.');
        return;
      }
      currentUser = { fullname, course, admission };
      loginContainer.classList.add('hidden');
      examContainer.classList.remove('hidden');
      studentInfo.innerText = `👤 ${fullname} · ${course} · ${admission}`;

      answers = new Array(questions.length).fill(null).map(() => ({ value: null, text: '' }));
      renderQuestions();

      timeLeft = 7200;
      timerDisplay.innerText = '02:00:00';
      timerDisplay.classList.remove('warning');
      if (timerInterval) clearInterval(timerInterval);
      startTimer();

      examActive = true;
      tabSwitchCount = 0;
      fullscreenExitCount = 0;
      antiCheatLog.classList.add('hidden');
      startAntiCheat();

      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    });

    document.querySelectorAll('input').forEach(inp => {
      inp.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') e.preventDefault();
      });
    });

    window.addEventListener('load', () => {
      loginContainer.classList.remove('hidden');
      examContainer.classList.add('hidden');
      overlay.classList.add('hidden');
    });

    window.addEventListener('beforeunload', (e) => {
      if (examActive) {
        e.preventDefault();
        e.returnValue = 'Exam in progress. Are you sure?';
      }
    });

  })();
</script>
